name: Update Trade Map (who buys & sells what)

on:
  schedule:
    - cron: "40 21,3,9,15 * * *"   # 03:10, 09:10, 15:10, 21:10 IST — each run refreshes up to 20 products older than 6 days (stays under the API quota)
  workflow_dispatch:
    inputs:
      all:
        description: "Try every product now (stops when the API quota runs out; the rest follow in later runs)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-trademap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect world trade figures from UN Comtrade (no AI, no key)
        continue-on-error: true
        env:
          TM_ALL: ${{ github.event.inputs.all == 'true' && '1' || '' }}
        run: node scripts/fetch-trademap.mjs
      - name: Exchange rates (free, no key)
        continue-on-error: true
        run: node scripts/fetch-fx.mjs
      - name: Save changes
        run: |
          git config user.name "garcha-exim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trademap.json data/trademap-status.json data/fx.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Trade Map update $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push
