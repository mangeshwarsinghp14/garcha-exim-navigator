name: Update EXIM rulings

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST
    - cron: "30 13 * * *"  # 19:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rulings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect DGFT & RBI updates (no AI)
        run: node scripts/fetch-updates.mjs
      - name: Save changes
        run: |
          git config user.name "garcha-exim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/updates.json data/status.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily rulings update $(date -u +%Y-%m-%d)"
          git push
